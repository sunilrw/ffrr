[package]
name = "ffrr"
version = "1.0.0"
edition = "2021"
authors = ["Sunil Warrier"]
license = "MIT OR Unlicense"
description = "FFRR — Fast Find, Replace & Refactor Engine (Multi-Threaded, Archive-Native .zip/.rar/.gz/.tar/.zst, Context/Intent-Aware, File Grouping, Duplicate Finder, CLI + TUI + Web + GUI + MCP) — Made using vibe coding by Sunil Warrier"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
anyhow = "1.0"
regex = "1.11"
aho-corasick = "1.1"
flate2 = "1.0"
zstd = "0.13"
bzip2 = "0.4"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
rayon = "1.10"
walkdir = "2.5"
glob = "0.3"
encoding_rs = "0.8"
blake3 = "1.5"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.7"
ratatui = "0.28"
crossterm = "0.28"

tao = { version = "0.30", optional = true }
wry = { version = "0.44", optional = true }

[features]
default = []
gui = ["dep:tao", "dep:wry"]

[profile.dev]
opt-level = 1
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 2
lto = false
incremental = true
codegen-units = 64
panic = "abort"
strip = "none"

[profile.dist]
inherits = "release"
opt-level = 3
lto = "thin"
incremental = false
codegen-units = 16
strip = "symbols"
